project:
  type: website
  output-dir: _site

website:
  title: "flushwhy"
  description: "Notes on systems engineering, game technology, developer tools, applied machine learning, and the work behind building software."
  favicon: favicon.ico

  navbar:
    left:
      - href: index.qmd
        text: home
      - href: posts.qmd
        text: writing
      - href: https://flushwhy.github.io/labs/about
        text: about
      - href: https://flushwhy.github.io/labs
        text: "→ labs"
    right:
      - icon: github
        href: https://github.com/flushwhy
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS

  page-footer:
    left: "[FlushLabs ↗](https://flushwhy.github.io/labs)"
    right: "Published with [Quarto](https://quarto.org)"
    center: "© 2026 Ryan Flush"

execute:
  engine: markdown

format:
  html:
    theme:
      - cosmo
      - flushwhy.scss
    highlight-style: monokai
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-title: "on this page"
